name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --org com.musthafa --project-name pdf_converter .

      - name: Remove default test
        run: rm -rf test

      - name: Force compileSdk 36
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          cat > /tmp/patch.kts <<'EOF'
          subprojects {
              if (name != "app") {
                  afterEvaluate {
                      extensions.findByName("android")?.let { ext ->
                          ext.javaClass.getMethod("compileSdkVersion", Int::class.javaPrimitiveType).invoke(ext, 36)
                      }
                  }
              }
          }

          EOF
          cat /tmp/patch.kts android/build.gradle.kts > /tmp/new.kts
          mv /tmp/new.kts android/build.gradle.kts

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
