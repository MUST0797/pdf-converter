name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('pubspec.yaml') }}
          restore-keys: gradle-

      - name: Gradle mirror (avoids Maven 429 errors)
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
          def mirror = 'https://maven-central.storage-download.googleapis.com/maven2/'
          beforeSettings { settings ->
              settings.pluginManagement.repositories {
                  maven { url mirror }
              }
          }
          allprojects {
              buildscript.repositories {
                  maven { url mirror }
              }
              repositories {
                  maven { url mirror }
              }
          }
          EOF

      - name: Generate Android project files
        run: flutter create --platforms=android --org com.musthafa --project-name pdf_converter .

      - name: Remove default test
        run: rm -rf test

      - name: Force compileSdk 36
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          cat > /tmp/patch.kts <<'EOF'
          subprojects {
              if (name != "app") {
                  afterEvaluate {
                      extensions.findByName("android")?.let { ext ->
                          ext.javaClass.getMethod("compileSdkVersion", Int::class.javaPrimitiveType).invoke(ext, 36)
                      }
                  }
              }
          }

          EOF
          cat /tmp/patch.kts android/build.gradle.kts > /tmp/new.kts
          mv /tmp/new.kts android/build.gradle.kts

      - run: flutter pub get

      - name: Build release APK
        run: |
          for i in 1 2 3 4; do
            flutter build apk --release && exit 0
            echo "Build failed (attempt $i), waiting before retry..."
            sleep 60
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
