name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Gradle cache
        id: cache-gradle
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pubspec.yaml', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Gradle mirror (init script, avoids Maven Central 429)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/mirror.gradle <<'EOF'
          def mirrorUrl = 'https://maven-central.storage-download.googleapis.com/maven2/'

          beforeSettings { settings ->
              settings.pluginManagement {
                  repositories {
                      all { repo ->
                          if (repo instanceof MavenArtifactRepository && repo.url.toString().contains('repo.maven.apache.org/maven2')) {
                              repo.url = uri(mirrorUrl)
                          }
                      }
                      maven { url = uri(mirrorUrl) }
                      gradlePluginPortal()
                  }
              }
          }

          gradle.projectsLoaded {
              rootProject.buildscript.repositories.all { repo ->
                  if (repo instanceof MavenArtifactRepository && repo.url.toString().contains('repo.maven.apache.org/maven2')) {
                      repo.url = uri(mirrorUrl)
                  }
              }
              allprojects { project ->
                  project.buildscript.repositories.all { repo ->
                      if (repo instanceof MavenArtifactRepository && repo.url.toString().contains('repo.maven.apache.org/maven2')) {
                          repo.url = uri(mirrorUrl)
                      }
                  }
                  project.repositories.all { repo ->
                      if (repo instanceof MavenArtifactRepository && repo.url.toString().contains('repo.maven.apache.org/maven2')) {
                          repo.url = uri(mirrorUrl)
                      }
                  }
              }
          }
          EOF
          cat ~/.gradle/init.d/mirror.gradle

      - name: Generate Android project files
        run: flutter create --platforms=android --org com.musthafa --project-name pdf_converter .

      - name: Remove default test
        run: rm -rf test

      - name: Force compileSdk 36
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          cat > /tmp/patch.kts <<'EOF'
          subprojects {
              if (name != "app") {
                  afterEvaluate {
                      extensions.findByName("android")?.let { ext ->
                          ext.javaClass.getMethod("compileSdkVersion", Int::class.javaPrimitiveType).invoke(ext, 36)
                      }
                  }
              }
          }

          EOF
          cat /tmp/patch.kts android/build.gradle.kts > /tmp/new.kts
          mv /tmp/new.kts android/build.gradle.kts

      - name: Set Android app name
        run: |
          python3 -c '
          import pathlib, re
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          txt = p.read_text(encoding="utf-8")
          txt = re.sub(r'\''android:label="[^"]*"'\'', '\''android:label="PDF Converter Team"'\'', txt, count=1)
          p.write_text(txt, encoding="utf-8")
          '

      - run: flutter pub get

      - name: Build release APK
        run: |
          for i in 1 2 3 4; do
            flutter build apk --release && exit 0
            echo "Build failed (attempt $i), waiting before retry..."
            sleep 30
          done
          exit 1

      - name: Save Gradle cache
        if: success() && steps.cache-gradle.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pubspec.yaml', '**/gradle-wrapper.properties') }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
