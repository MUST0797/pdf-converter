name: pdf_converter
description: Free offline PDF converter app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.2
  pdf: ^3.11.1
  path_provider: ^2.1.4
  share_plus: ^10.0.0
  open_filex: ^4.5.0
  archive: ^3.6.1
  xml: ^6.5.0
  syncfusion_flutter_pdf: any
  printing: ^5.13.0
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true
